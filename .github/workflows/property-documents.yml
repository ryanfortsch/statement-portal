name: Property document access

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'scripts/property-document-smoke.mjs'
      - 'scripts/photo-upload-smoke.mjs'
      - 'scripts/onboarding-autosave-smoke.mjs'
      - 'scripts/listing-editor-smoke.mjs'
      - 'scripts/sca-launch-smoke.mjs'
      - 'scripts/field-report-smoke.mjs'
      - 'scripts/work-slip-editor-smoke.mjs'
      - 'scripts/work-slip-comments-smoke.mjs'
      - 'scripts/work-slip-routing-smoke.mjs'
      - '.github/workflows/property-documents.yml'
  push:
    branches: ['codex/protect-property-wifi-documents']

permissions:
  contents: read

concurrency:
  group: property-documents-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PROPERTY_DOCUMENT_TEST_OUTPUT: /tmp/helm-property-documents
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          # Existing civic date fixtures use local midnight in Massachusetts.
          TZ: America/New_York
      - name: Verify access and real Chromium PDFs with synthetic data
        run: node scripts/property-document-smoke.mjs
      - name: Verify batch photo uploads with synthetic files
        run: node scripts/photo-upload-smoke.mjs
      - name: Verify onboarding autosave with synthetic answers
        run: node scripts/onboarding-autosave-smoke.mjs
      - name: Verify listing editor recovery with synthetic copy
        run: node scripts/listing-editor-smoke.mjs
      - name: Verify launch draft and preview safeguards with synthetic listings
        run: node scripts/sca-launch-smoke.mjs
      - name: Verify field report recovery with synthetic submissions
        run: node scripts/field-report-smoke.mjs
      - name: Verify work slip editing recovery with synthetic saves
        run: node scripts/work-slip-editor-smoke.mjs
      - name: Verify work slip comments and completion notes with synthetic saves
        run: node scripts/work-slip-comments-smoke.mjs
      - name: Verify assignment, routing, and snooze recovery with synthetic saves
        run: node scripts/work-slip-routing-smoke.mjs
      - run: npx tsc --noEmit
      - name: Show local app log on failure
        if: failure()
        run: cat "$PROPERTY_DOCUMENT_TEST_OUTPUT/smoke-next.log" 2>/dev/null || true
