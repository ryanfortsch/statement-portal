name: Property document access

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - 'scripts/property-document-smoke.mjs'
      - 'scripts/photo-upload-smoke.mjs'
      - 'scripts/onboarding-autosave-smoke.mjs'
      - 'scripts/listing-editor-smoke.mjs'
      - 'scripts/sca-launch-smoke.mjs'
      - 'scripts/field-report-smoke.mjs'
      - 'scripts/work-slip-editor-smoke.mjs'
      - 'scripts/work-slip-comments-smoke.mjs'
      - 'scripts/work-slip-routing-smoke.mjs'
      - 'scripts/editor-recovery-smoke.mjs'
      - 'scripts/forms-recovery-smoke.mjs'
      - 'scripts/queue-actions-smoke.mjs'
      - 'scripts/sync-scheduling-smoke.mjs'
      - 'scripts/intake-jobs-smoke.mjs'
      - 'scripts/property-capture-smoke.mjs'
      - 'scripts/guest-materials-smoke.mjs'
      - 'scripts/messaging-drafts-smoke.mjs'
      - 'scripts/layout-field-photos-smoke.mjs'
      - 'scripts/photos-onboarding-feed-smoke.mjs'
      - 'scripts/tests/layout-field-photos*'
      - 'supabase/migrations/20260929151500_atomic_inspection_layout_and_field_photos.sql'
      - '.github/workflows/property-documents.yml'
  push:
    branches: ['codex/protect-property-wifi-documents']

permissions:
  contents: read

concurrency:
  group: property-documents-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PROPERTY_DOCUMENT_TEST_OUTPUT: /tmp/helm-property-documents
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          # Existing civic date fixtures use local midnight in Massachusetts.
          TZ: America/New_York
      - name: Verify access and real Chromium PDFs with synthetic data
        run: node scripts/property-document-smoke.mjs
      - name: Verify sync results, inspection plans, contractor jobs, and property shortcuts
        run: node scripts/sync-scheduling-smoke.mjs
      - name: Verify contractor intake, preferences, checklist, inbox, and trip editing
        run: node scripts/intake-jobs-smoke.mjs
      - name: Verify property capture, walkthrough, inline edits, and address recovery
        run: node scripts/property-capture-smoke.mjs
      - name: Verify bedroom photos, onboarding invitations and feed recovery
        run: node scripts/photos-onboarding-feed-smoke.mjs
      - name: Verify inspection layout recovery and inline work slip photos
        run: node scripts/layout-field-photos-smoke.mjs
      - name: Verify reminder and saved reply draft recovery
        run: node scripts/messaging-drafts-smoke.mjs
      - name: Verify guest materials, checklist saves, and owner request recovery
        run: node scripts/guest-materials-smoke.mjs
      - name: Verify new forms, contact details, vendors, and document recovery
        run: node scripts/forms-recovery-smoke.mjs
      - name: Verify bulk, quick completion, CRM triage, and vendor work-order recovery
        run: node scripts/queue-actions-smoke.mjs
      - name: Verify batch photo uploads with synthetic files
        run: node scripts/photo-upload-smoke.mjs
      - name: Verify onboarding autosave with synthetic answers
        run: node scripts/onboarding-autosave-smoke.mjs
      - name: Verify listing editor recovery with synthetic copy
        run: node scripts/listing-editor-smoke.mjs
      - name: Verify launch draft and preview safeguards with synthetic listings
        run: node scripts/sca-launch-smoke.mjs
      - name: Verify field report recovery with synthetic submissions
        run: node scripts/field-report-smoke.mjs
      - name: Verify work slip editing recovery with synthetic saves
        run: node scripts/work-slip-editor-smoke.mjs
      - name: Verify work slip comments and completion notes with synthetic saves
        run: node scripts/work-slip-comments-smoke.mjs
      - name: Verify assignment, routing, and snooze recovery with synthetic saves
        run: node scripts/work-slip-routing-smoke.mjs
      - name: Verify owner input, CRM activity, tasks, Playbook, and room recovery
        run: node scripts/editor-recovery-smoke.mjs
      - run: npx tsc --noEmit
      - name: Show local app log on failure
        if: failure()
        run: cat "$PROPERTY_DOCUMENT_TEST_OUTPUT/smoke-next.log" 2>/dev/null || true

  layout-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: helm_synthetic_layout
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: helm_synthetic_layout
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify atomic layout, custom retries, photo appends and RPC permissions
        run: psql -v ON_ERROR_STOP=1 -f scripts/tests/layout-field-photos.sql
      - name: Verify simultaneous photo additions
        run: bash scripts/tests/layout-field-photos-concurrency.sh
