name: Channex production database
on:
  pull_request:
    paths:
      - 'src/lib/channex-bookings/**'
      - 'src/lib/channex-inventory/**'
      - 'src/lib/channex-messaging/**'
      - 'src/lib/automations.ts'
      - 'src/lib/availability.ts'
      - 'src/lib/rate-plan.ts'
      - 'src/lib/rental-periods.ts'
      - 'src/lib/channex-production*'
      - 'src/app/api/cron/channex-production/**'
      - 'src/app/api/cron/channex-bookings/**'
      - 'src/app/api/cron/channex-messages/**'
      - 'src/app/api/cron/channex-cleaners/**'
      - 'src/app/api/channex/reconciliation/**'
      - 'src/app/api/channex/message-control/**'
      - 'supabase/migrations/*channex*'
      - 'scripts/test-channex-database.mjs'
      - 'scripts/test-channex-booking-intake.mts'
      - 'scripts/test-channex-new-stay-admission.mts'
      - 'src/lib/__tests__/channex-new-stay-admission.test.ts'
      - 'src/lib/__tests__/channex-booking-runtime.test.ts'
      - 'src/lib/__tests__/fixtures/channex-booking-intake.ts'
      - 'scripts/test-channex-planner.mts'
      - 'scripts/test-channex-delivery.mts'
      - 'scripts/test-channex-cycle.mts'
      - 'scripts/test-channex-messages.mts'
      - 'scripts/test-channex-schedule.mts'
      - 'scripts/test-channex-schedule-coordinator.mts'
      - 'scripts/test-channex-source-timing.mts'
      - 'scripts/test-channex-timing-binding.mts'
      - 'scripts/test-channex-release-guards.mts'
      - 'scripts/test-channex-schedule-runtime.mts'
      - 'scripts/test-channex-cleaner-schedules.mts'
      - 'scripts/channex-message-control-checks.mts'
      - 'scripts/test-channex-new-bookings.mts'
      - 'src/lib/__tests__/channex-new-booking-lifecycle.test.ts'
      - 'src/lib/__tests__/fixtures/channex-new-booking-rehearsal.ts'
      - 'scripts/channex-cleaner-enrollment-smoke.mjs'
      - 'scripts/channex-automation-operations-smoke.mjs'
      - 'src/app/channels/65_calderwood/message-status/**'
      - 'src/app/channels/65_calderwood/message-preparation/cleaners/**'
      - 'scripts/test-channex-template-release.mts'
      - 'src/app/api/channex/message-preparation/**'
      - 'scripts/test-channex-reconciliation.mts'
      - 'scripts/tests/channex*'
      - '.github/workflows/channex-production.yml'
permissions:
  contents: read
jobs:
  channex-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: helm_synthetic_channex
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-only
      PGDATABASE: helm_synthetic_channex
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node scripts/test-channex-database.mjs
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-planner.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-delivery.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-cycle.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-reconciliation.mts
      - run: bash scripts/tests/channex-concurrency.sh
      - run: bash scripts/tests/channex-inventory-concurrency.sh
      - run: bash scripts/tests/channex-delivery-concurrency.sh
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-messages.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-schedule.mts
      - run: bash scripts/tests/channex-schedule-concurrency.sh
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-schedule-coordinator.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-source-timing.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-timing-binding.mts
      - run: bash scripts/tests/channex-messages-concurrency.sh
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-release-guards.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-template-release.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-schedule-runtime.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-cleaner-schedules.mts
      - run: node scripts/channex-cleaner-enrollment-smoke.mjs
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/channex-automation-operations-smoke.mjs
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-new-bookings.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-booking-intake.mts
      - run: node --import ./scripts/server-only-test-hook.mjs scripts/test-channex-new-stay-admission.mts
